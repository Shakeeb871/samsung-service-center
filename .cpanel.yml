---
# cPanel Git Version Control deployment.
#
# cPanel runs these tasks as your cPanel user when you click
# "Deploy HEAD Commit" in cPanel > Files > Git Version Control.
#
# ---------------------------------------------------------------------
# DEPLOYPATH must be the document root of samsung.aiqonquickcool.com.my.
# Confirm the exact path in cPanel > Domains — it is shown next to the
# subdomain — and change the line below if it differs. Common values:
#
#   $HOME/public_html/samsung
#   $HOME/samsung.aiqonquickcool.com.my
#
# Get this wrong and the deploy still reports success; the files simply
# land in a folder nothing is serving.
# ---------------------------------------------------------------------
#
# README.md, .cpanel.yml and .git are deliberately not copied. The repo is
# cloned to ~/repositories/, outside the web root, so nothing under .git is
# ever reachable by URL.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/samsung/
    - /bin/mkdir -p $DEPLOYPATH

    # Pages
    - /bin/cp -R index.php $DEPLOYPATH
    - /bin/cp -R about.php $DEPLOYPATH
    - /bin/cp -R contact.php $DEPLOYPATH
    - /bin/cp -R 404.php $DEPLOYPATH
    - /bin/cp -R deploy-check.php $DEPLOYPATH

    # Directories.
    #
    # The trailing "/." matters. "cp -R services $DEPLOYPATH" copies the
    # folder INTO an existing folder of the same name, giving you
    # services/services on the second deploy. Copying "services/." into a
    # pre-made target copies the contents instead, so repeat deploys
    # overwrite cleanly.
    #
    # Nothing is deleted first, deliberately. An "rm -rf" here would be one
    # typo in DEPLOYPATH away from wiping a directory of the parent site.
    # The trade-off: a file deleted from the repo stays on the server until
    # it is removed by hand.
    - /bin/mkdir -p $DEPLOYPATH/services $DEPLOYPATH/inc $DEPLOYPATH/api $DEPLOYPATH/assets
    - /bin/cp -R services/. $DEPLOYPATH/services/
    - /bin/cp -R inc/. $DEPLOYPATH/inc/
    - /bin/cp -R api/. $DEPLOYPATH/api/
    - /bin/cp -R assets/. $DEPLOYPATH/assets/

    # Config and crawler files
    - /bin/cp -R .htaccess $DEPLOYPATH
    - /bin/cp -R robots.txt $DEPLOYPATH
    - /bin/cp -R sitemap.xml $DEPLOYPATH
