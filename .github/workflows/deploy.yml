# Builds the static copy and publishes it to GitHub Pages.
#
# GitHub Pages does not run PHP, so the PHP in this repository never
# reaches the web. build.php renders every page once and writes plain
# HTML into dist/, and that is what gets published.

name: Deploy to GitHub Pages

# Run by hand only. The domain is served from PHP hosting, which pulls
# this repository directly, so an automatic Pages deploy on every push
# would only produce failure mail. Switch the push trigger back on if the
# site ever moves to Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Two overlapping runs can publish out of order and
# leave the older build live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Build the static site
        env:
          # Set FORM_ENDPOINT in Settings → Secrets and variables →
          # Actions → Variables to switch the enquiry forms back on
          # through Formspree. Left unset, the pages show the call and
          # WhatsApp panel instead of a form that posts into nothing.
          FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
        run: php build.php

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
